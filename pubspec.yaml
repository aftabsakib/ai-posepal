name: ai_posepal
description: "AI-powered camera app with real-time pose suggestions"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.11.5

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  camera: ^0.12.0+1
  google_mlkit_pose_detection: ^0.14.1
  http: ^1.6.0
  gal: ^2.3.2
  permission_handler: ^12.0.1
  envied: ^1.3.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.4.0
  envied_generator: ^1.3.4

flutter:
  uses-material-design: true
